<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulateur de chiffrage de l’Avenir en Commun 2027</title>
    <meta name="description" content="Simulateur budgétaire pédagogique : explorez l'effet de leviers de dépenses, de recettes, d'investissement et de financement sur le solde public, avec hypothèses explicites et intervalles Monte-Carlo." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Simulateur de chiffrage de l’Avenir en Commun 2027" />
    <meta property="og:description" content="Un outil pédagogique pour explorer un chiffrage budgétaire : hypothèses, corrections, intervalles Monte-Carlo. Pas une prévision." />
    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a29" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
